name: Patch pose tracker v4

on:
  push:
    branches:
      - feature/pose-form-voice-v3
    paths:
      - .github/workflows/patch-pose-tracker-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pose-form-voice-v3
          fetch-depth: 0
      - name: Apply tracker v4 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pose-spike.js')
          s=p.read_text()
          old="minPoseDetectionConfidence:0.7,minPosePresenceConfidence:0.7,minTrackingConfidence:0.7"
          new="minPoseDetectionConfidence:0.45,minPosePresenceConfidence:0.45,minTrackingConfidence:0.5"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('expected MediaPipe threshold string not found')
          s=s.replace('Tracking v3 · One working side is measured.','Tracking v4 · Motion-aware subject association; one working side is measured.',1)
          s=s.replace('Tracking v3 · opt-in · check the log','Tracking v4 · opt-in · motion-aware lock',1)
          s=s.replace('trackingVersion:2','trackingVersion:4',1)
          p.write_text(s)

          p=Path('pose-form-coach.js')
          s=p.read_text()
          old="""      let choices=scored.filter(x=>x.candidate.quality>=config.highConfidence&&x.cost<=config.highCost),tier='high';
      if(!choices.length){choices=scored.filter(x=>x.candidate.quality>=config.lowConfidence&&x.overlap>=2&&x.cost<=config.lowCost);tier='low'}
      if(!choices.length)return hold('Lock held · pose confidence dipped.',t);
      if(choices.length>1&&choices[1].cost-choices[0].cost<config.ambiguityMargin){stats.ambiguities++;return hold('Two people overlap the predicted track. Counting paused until the view separates.',t)}
      const best=choices[0];return accept(best.candidate,t,aspect,tier,best.cost,best.overlap);"""
          new="""      const choices=scored.filter(x=>(x.candidate.quality>=config.highConfidence&&x.cost<=config.highCost)||(x.candidate.quality>=config.lowConfidence&&x.overlap>=2&&x.cost<=config.lowCost)).sort((a,b)=>a.cost-b.cost);
      if(!choices.length)return hold('Lock held · pose confidence dipped.',t);
      if(choices.length>1&&choices[1].cost-choices[0].cost<config.ambiguityMargin){stats.ambiguities++;return hold('Two people overlap the predicted track. Counting paused until the view separates.',t)}
      const best=choices[0],tier=best.candidate.quality>=config.highConfidence?'high':'low';return accept(best.candidate,t,aspect,tier,best.cost,best.overlap);"""
          if old not in s:
              raise SystemExit('expected tracker association block not found')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/pose-assistant-v3.test.js')
          q=t.read_text()
          old="""test('pose tracking tuning supports side-on acquisition and brief confidence flicker',()=>{
  const source=fs.readFileSync('pose-form-coach.js','utf8');
  assert(source.includes('confidence:0.58'));
  assert(source.includes('acquireMs:650'));
  assert(source.includes('lossMs:900'));
  assert(source.includes('softInterrupts>=15'));
  assert(source.includes('__ironSixForceInterrupt'));
  assert(source.includes('squat:500'));
  assert(source.includes('__ironSixTrackingTuned'));
});"""
          new="""test('pose tracking v4 uses motion association, side-on confidence tiers and brief-dropout tolerance',()=>{
  const source=fs.readFileSync('pose-form-coach.js','utf8');
  assert(source.includes('lowConfidence:0.18'));
  assert(source.includes('highConfidence:0.48'));
  assert(source.includes('acquireMs:420'));
  assert(source.includes('maxCoastMs:950'));
  assert(source.includes('subjectAssociation'));
  assert(source.includes('softInterrupts>=15'));
  assert(source.includes('__ironSixForceInterrupt'));
  assert(source.includes('squat:500'));
  assert(source.includes('__ironSixSubjectTrackerV4'));
});"""
          if old not in q:
              raise SystemExit('expected old tracker test block not found')
          q=q.replace(old,new,1)
          marker="assert(source.includes('assistantVersion:3'));"
          detector="""assert(source.includes('assistantVersion:3'));
  assert(source.includes('trackingVersion:4'));
  assert(source.includes('minPoseDetectionConfidence:0.45'));
  assert(source.includes('minPosePresenceConfidence:0.45'));
  assert(source.includes('minTrackingConfidence:0.5'));"""
          q=q.replace(marker,detector,1)
          t.write_text(q)
          PY
      - name: Validate tracker files
        shell: bash
        run: |
          node --check pose-spike.js
          node --check pose-form-coach.js
          node --test tests/pose-subject-tracker-v4.test.js tests/pose-form-coach.test.js tests/pose-assistant-v3.test.js
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/patch-pose-tracker-v4.yml
          rm -f pose-subject-tracker.js
          git config user.name "Iron Six camera patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A pose-spike.js pose-form-coach.js tests/pose-assistant-v3.test.js pose-subject-tracker.js .github/workflows/patch-pose-tracker-v4.yml
          git commit -m "Integrate motion-aware tracker v4 with pose detector"
          git push origin HEAD:feature/pose-form-voice-v3
