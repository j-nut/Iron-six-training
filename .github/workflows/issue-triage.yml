name: Issue intake
on:
  issues:
    types: [opened, reopened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue.labels.some(label => label.name.startsWith('status:'))) {
              await github.rest.issues.addLabels({...context.repo, issue_number: issue.number, labels: ['status:triage']});
            }
