name: Repository labels and milestones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-setup.yml', 'scripts/github/repository-setup.cjs']
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: repository-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./scripts/github/repository-setup.cjs')({github, context, core});
