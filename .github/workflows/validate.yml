name: Validate Iron Six

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Verify accounts, durable saves, and workout modes
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Syntax-check browser and Vercel JavaScript
        run: |
          set -e
          for f in *.js api/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/functions/coach/deno.json supabase/functions/coach/index.ts
          deno check --config supabase/functions/auth-bridge/deno.json supabase/functions/auth-bridge/index.ts
      - name: Verify required app modules exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'core.js','workout-lower.js','workout-shoulders.js','workout-chest.js',
            'workout-back.js','workout-lower-hypertrophy.js','workout-upper.js',
            'workout-dispatch.js','engine.js','session-planner.js','workout-store.js',
            'ui1.js','ui2.js','ui3.js','exercise-guide.js','exercise-visuals.js',
            'exercise-media-catalog.js','exercise-media.js','local-ai-fallback.js',
            'coach.js','coach-recovery.js','circuit-player.js','social-auth.js',
            'cloud-sync.js','cloud-history-sync.js','auth-hardening.js','account-polish.js',
            'native/entry.mjs','native/runtime.mjs','scripts/build-android-web.mjs',
            'android/app/src/main/java/com/ironsix/training/WorkoutBackupPlugin.java',
            'api/config.js','api/coach.js','api/auth-status.js','api/verify-nomad-google.js',
            'supabase/schema.sql','supabase/config.toml',
            'supabase/functions/coach/index.ts','supabase/functions/coach/deno.json',
            'supabase/functions/auth-bridge/index.ts','supabase/functions/auth-bridge/deno.json'
          ]
          missing=[p for p in required if not Path(p).exists()]
          if missing: raise SystemExit('Missing files: '+', '.join(missing))
          print('All required files present')
          PY
      - name: Verify Coach fallback handles static-host responses
        run: node tests/coach-fallback.test.js
      - name: Verify optional features load from every entrypoint
        run: node tests/feature-entrypoints.test.js
