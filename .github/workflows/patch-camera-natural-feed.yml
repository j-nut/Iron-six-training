name: Patch natural camera feed
on:
  push:
    branches:
      - feature/pose-form-voice-v3
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pose-form-voice-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair camera capture without portrait crop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pose-spike.js')
          s=p.read_text()
          s=s.replace("aspect-ratio:var(--pose-stage-ratio,3/4)","aspect-ratio:var(--pose-stage-ratio,4/3)",1)
          old="""    const portrait=(window.innerHeight||0)>=(window.innerWidth||0);
    const acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:portrait?720:1280},height:{ideal:portrait?1280:720},aspectRatio:{ideal:portrait?9/16:16/9},frameRate:{ideal:30,max:30}},audio:false});
    if(id!==sessionId){for(const track of acquired.getTracks())track.stop();return}stream=acquired;video.srcObject=stream;await video.play().catch(()=>{});
    if(!video.videoWidth)await new Promise(resolve=>{video.addEventListener('loadedmetadata',resolve,{once:true});setTimeout(resolve,3000)});
    syncStageAspect();"""
          new="""    const acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:960},height:{ideal:720},frameRate:{ideal:30,max:30},resizeMode:{ideal:'none'}},audio:false});
    if(id!==sessionId){for(const track of acquired.getTracks())track.stop();return}
    const cameraTrack=acquired.getVideoTracks?.()[0]||null;
    try{
      const caps=cameraTrack?.getCapabilities?.();
      if(caps?.zoom&&Number.isFinite(caps.zoom.min))await cameraTrack.applyConstraints({advanced:[{zoom:caps.zoom.min}]});
    }catch(_){}
    stream=acquired;video.srcObject=stream;await video.play().catch(()=>{});
    if(!video.videoWidth)await new Promise(resolve=>{video.addEventListener('loadedmetadata',resolve,{once:true});setTimeout(resolve,3000)});
    syncStageAspect();"""
          assert old in s, 'portrait capture block not found'
          s=s.replace(old,new,1)
          s=s.replace("Form watch active — complete a rep with your head, hips, knees and feet visible.","Form watch active — complete a rep with your working-side shoulder, hip, knee and ankle visible.",1)
          old_diag="resolution:video&&video.videoWidth?`${video.videoWidth}x${video.videoHeight}`:null,form:"
          new_diag="resolution:video&&video.videoWidth?`${video.videoWidth}x${video.videoHeight}`:null,cameraSettings:stream?.getVideoTracks?.()[0]?.getSettings?.()||null,form:"
          assert old_diag in s, 'diagnostics resolution block not found'
          s=s.replace(old_diag,new_diag,1)
          p.write_text(s)

          t=Path('tests/pose-assistant-v3.test.js')
          ts=t.read_text()
          old_test="""test('camera assistant preserves the full portrait camera frame and exposes form-analysis status',()=>{
  const source=fs.readFileSync('pose-spike.js','utf8');
  assert(source.includes('object-fit:contain'));
  assert(source.includes(\"aspectRatio:{ideal:portrait?9/16:16/9}\"));
  assert(source.includes(\"stage.style.setProperty('--pose-stage-ratio'\"));
  assert(source.includes('form analysis was skipped'));
  assert(source.includes('analyzed: no camera-visible issue crossed the cue threshold'));
  assert(source.includes('video?.videoWidth&&video?.videoHeight'));
});"""
          new_test="""test('camera assistant shows the whole feed without forcing a portrait sensor crop',()=>{
  const source=fs.readFileSync('pose-spike.js','utf8');
  assert(source.includes('object-fit:contain'));
  assert(source.includes(\"width:{ideal:960},height:{ideal:720}\"));
  assert(source.includes(\"resizeMode:{ideal:'none'}\"));
  assert(!source.includes('aspectRatio:{ideal:portrait'));
  assert(source.includes('getCapabilities'));
  assert(source.includes('zoom:caps.zoom.min'));
  assert(source.includes(\"stage.style.setProperty('--pose-stage-ratio'\"));
  assert(source.includes('form analysis was skipped'));
  assert(source.includes('analyzed: no camera-visible issue crossed the cue threshold'));
  assert(source.includes('cameraSettings:'));
});"""
          assert old_test in ts, 'camera regression test not found'
          t.write_text(ts.replace(old_test,new_test,1))
          PY
      - name: Validate camera patch
        run: |
          node --check pose-spike.js
          npm test
      - name: Commit repaired camera path and remove one-shot workflow
        run: |
          rm .github/workflows/patch-camera-natural-feed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore reliable wide camera capture without portrait crop"
          git push origin HEAD:feature/pose-form-voice-v3