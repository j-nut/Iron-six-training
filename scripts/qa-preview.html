<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Six responsive review</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090c;color:#e5e7eb;font:14px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #363d45}h1{font-size:16px;margin:0 auto 0 0}button,a{font:inherit;border:1px solid #363d45;background:#191c20;color:#e5e7eb;padding:9px 12px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{border-color:#2ee580;color:#2ee580}main{display:flex;justify-content:center;padding:20px;overflow:auto}iframe{display:block;border:1px solid #363d45;width:375px;height:812px;flex:none;border-radius:12px;background:#101214}p{margin:0;color:#b0b8c2}button:focus-visible,a:focus-visible{outline:2px solid #2ee580;outline-offset:3px}
</style></head><body><header><h1>Responsive review</h1><p>Preview-only · guest data stays in this preview</p><button data-width="320">320 px</button><button data-width="375" aria-pressed="true">375 px</button><button data-width="430">430 px</button><button data-width="768">768 px</button><button data-width="1200">1200 px</button><a href="/" target="_blank" rel="noopener">Open app</a></header><main><iframe src="/" title="Iron Six app preview"></iframe></main><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const width=Number(button.dataset.width);frame.style.width=width+'px';frame.style.height=width>=768?'900px':'812px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));
</script></body></html>
